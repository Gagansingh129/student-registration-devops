name: Student Registration CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean package --file pom.xml

      - name: Verify Unit Tests
        run: mvn test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-registration-app-jar
          path: target/student-registration-app-1.0.0.jar
          if-no-files-found: error

      - name: Build Docker Image
        run: |
          docker build -t student-registration-app:latest .
          docker images | grep student-registration-app
