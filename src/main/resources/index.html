<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-brand svg {
            width: 38px;
            height: 38px;
            fill: var(--primary-color);
        }

        .header-brand h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .registration-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            padding: 32px 28px;
        }

        .card-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .alert-success {
            display: none;
            margin-top: 24px;
            padding: 16px;
            border-radius: 10px;
            background-color: var(--success-bg);
            border: 1px solid #bbf7d0;
            color: #15803d;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-success h4 {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-note {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .badge-devops {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 9999px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header-brand">
        <svg viewBox="0 0 24 24">
            <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
        </svg>
        <h1>Student Portal</h1>
    </div>

    <div class="registration-card">
        <div class="card-header">
            <h2>Student Registration Form</h2>
            <p>Enter your details below to register for the course</p>
            <span class="badge-devops">DevOps CI/CD Verified Build</span>
        </div>

        <form id="registrationForm" method="POST" action="/register">
            <!-- 1. Student Name -->
            <div class="form-group">
                <label for="studentName">Student Name *</label>
                <div class="input-wrapper">
                    <input type="text" id="studentName" name="studentName" class="form-control" placeholder="Enter student's full name" required>
                </div>
            </div>

            <!-- 2. Roll Number -->
            <div class="form-group">
                <label for="rollNumber">Roll Number *</label>
                <div class="input-wrapper">
                    <input type="text" id="rollNumber" name="rollNumber" class="form-control" placeholder="e.g. 21BCS10145" required>
                </div>
            </div>

            <!-- 3. Email -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@university.edu" required>
                </div>
            </div>

            <!-- 4. Course -->
            <div class="form-group">
                <label for="course">Course *</label>
                <div class="input-wrapper">
                    <select id="course" name="course" class="form-control" required>
                        <option value="" disabled selected>Select registered course</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="DevOps & Cloud Computing">DevOps & Cloud Computing</option>
                        <option value="Artificial Intelligence & ML">Artificial Intelligence & ML</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Software Engineering">Software Engineering</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-submit">Submit Registration</button>
        </form>

        <div id="resultMessage" class="alert-success">
            <h4>
                <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                Registration Successful!
            </h4>
            <div id="responseDetails">Your registration details have been securely recorded.</div>
        </div>

        <div class="footer-note">
            DevOps Practical Workflow &bull; Git &bull; Maven &bull; Jenkins &bull; GitHub Actions &bull; Docker
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const roll = document.getElementById('rollNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const course = document.getElementById('course').value;

            if (!name || !roll || !email || !course) {
                alert('Please fill out all required fields.');
                return;
            }

            const payload = {
                studentName: name,
                rollNumber: roll,
                email: email,
                course: course
            };

            // Attempt async submission to server, fall back to in-browser preview
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                showSuccess(data.message || `Welcome ${name}! Roll Number ${roll} registered for ${course}.`);
            })
            .catch(() => {
                showSuccess(`Welcome <b>${name}</b>! Roll Number <b>${roll}</b> has been registered for <b>${course}</b> (Email: ${email}).`);
            });
        });

        function showSuccess(msg) {
            const resultBox = document.getElementById('resultMessage');
            const detailsBox = document.getElementById('responseDetails');
            detailsBox.innerHTML = msg;
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
